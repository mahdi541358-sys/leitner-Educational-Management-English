name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install dependencies
        run: npm install
      - name: Copy Excel library into the web app
        run: cp node_modules/xlsx/dist/xlsx.full.min.js www/xlsx.full.min.js
      - name: Add Android platform
        run: npx cap add android
      - name: Generate launcher icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#122A66' --iconBackgroundColorDark '#122A66'
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Leitner-Box.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Leitner-Box-APK
          path: Leitner-Box.apk
